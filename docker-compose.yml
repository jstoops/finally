services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides any DB_PATH in .env so the database always lands on the volume
      DB_PATH: /app/db/finally.db
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
